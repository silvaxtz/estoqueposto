name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Preparar dependências nativas do Electron
        run: npx electron-builder install-app-deps
      - name: Gerar instalador
        run: npm run dist
      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Estoque-Grupo-Atualize-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
