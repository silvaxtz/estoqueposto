<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estoque | Grupo Atualize</title>
<style>
:root{--navy:#102b68;--blue:#19438e;--green:#18a866;--bg:#f3f6fb;--ink:#17243b;--muted:#71809a;--line:#e5ebf3;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.layout{display:flex;min-height:100vh}.side{width:244px;background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column}.brand{background:#fff;border-radius:10px;padding:8px;margin:0 8px 25px}.brand img{width:100%;height:85px;object-fit:contain}.brand small{display:block;color:#64748b;text-align:center;font-size:9px;letter-spacing:1.5px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d7e1f5;text-align:left;padding:13px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff;border-left:3px solid var(--green)}.foot{margin-top:auto;color:#c6d3ec;font-size:11px;line-height:1.7;padding:12px}.main{flex:1;padding:28px 34px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}header small{font-size:10px;letter-spacing:1.4px;color:var(--muted)}h1{font-size:27px;color:var(--navy);margin:5px 0}.status{font-size:12px;color:#13764b;background:#e5f6ed;padding:9px 12px;border-radius:30px}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 4px 14px #102b6809}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:750;color:var(--navy);margin-top:8px}.panel{margin-bottom:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:16px;color:var(--navy);margin:0}.muted{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-size:12px;font-weight:650;cursor:pointer}.btn.green{background:var(--green)}.btn.light{background:#edf2fa;color:var(--navy)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.form input,.form select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:160px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:#77849a;background:#f8fafd;padding:12px 10px;white-space:nowrap}td{padding:12px 10px;border-top:1px solid var(--line)}td strong{color:#263c67}.tag{font-size:10px;border-radius:20px;padding:5px 8px;background:#e8f7ef;color:#147449}.tag.pending{background:#fff4df;color:#946200}.empty{text-align:center;padding:30px;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:11px;color:var(--muted);display:grid;gap:6px}.form .wide{grid-column:1/-1}.note{background:#fff8e8;border:1px solid #f0dfb5;color:#795c1b;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:950px){.side{width:190px}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.layout{display:block}.side{width:100%;padding:12px}.brand{display:flex;align-items:center;gap:12px;margin:0 0 10px}.brand img{width:125px;height:48px}.brand small{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.foot{display:none}.main{padding:17px}header{align-items:flex-start;gap:8px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}
</style></head>
<body><div class="layout">
<aside class="side"><div class="brand"><img src="assets/logo-atualize.jpg" alt="Grupo Atualize"><small>CONTROLE DE ESTOQUE</small></div>
<nav class="nav"><button class="active" data-page="inicio">▦ &nbsp; Visão geral</button><button data-page="Sorvetes">❄ &nbsp; Sorvetes</button><button data-page="Lubrificantes">◉ &nbsp; Lubrificantes</button><button data-page="Outros">▣ &nbsp; Outros produtos</button><button data-page="Movimentações">⇄ &nbsp; Movimentações</button><button data-page="Vendedores">♙ &nbsp; Vendedores</button><button data-page="Relatórios">▤ &nbsp; Relatórios</button></nav>
<div class="foot">● Painel web de demonstração<br>Os dados deste navegador não sincronizam com o aplicativo instalado no posto.</div></aside>
<main class="main"><header><div><small>GRUPO ATUALIZE / ESTOQUE</small><h1 id="title">Visão geral</h1></div><span class="status">● Painel web</span></header><div id="app"></div></main></div>
<script>
const initial=[
['51421','Cremosinho sabor leite condensado','Sorvetes',10,10],['51452','Cremosinho sabor maracujá','Sorvetes',10,10],['51438','Cremosinho sabor morango','Sorvetes',10,10],
['50240','Picolé cobertura Quy Lack','Sorvetes',22,22],['50684','Picolé cobertura Tentação','Sorvetes',22,22],
['50134','Picolé Milk Chocolate','Sorvetes',26,26],['50141','Picolé Milk Coco','Sorvetes',26,26],['50172','Picolé Milk Leite Condensado','Sorvetes',26,26],
['50295','Picolé Sublime Mousse Maracujá','Sorvetes',null,0],['50097','Picolé Suco Morango','Sorvetes',26,26],['50073','Picolé Suco Uva','Sorvetes',26,26],
['50332','Sorvete pote 2L Napolitano','Sorvetes',1,1],['50356','Sorvete pote 2L Passas','Sorvetes',1,1],['50745','Sorvete Quy Copão Napolitano','Sorvetes',null,0]];
let products=JSON.parse(localStorage.getItem('atualize-products')||'null')||initial.map(x=>({code:x[0],name:x[1],category:x[2],units:x[3],stock:x[4],min:0}));
let sellers=JSON.parse(localStorage.getItem('atualize-sellers')||'["Rayane","Bruno"]'),moves=JSON.parse(localStorage.getItem('atualize-moves')||'[]'),page='inicio';
const save=()=>{localStorage.setItem('atualize-products',JSON.stringify(products));localStorage.setItem('atualize-sellers',JSON.stringify(sellers));localStorage.setItem('atualize-moves',JSON.stringify(moves))};
const money=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(items){return items.length?'<div class="tablewrap"><table><thead><tr><th>CÓDIGO</th><th>PRODUTO</th><th>ESTOQUE</th><th>UN./CAIXA</th><th>STATUS</th></tr></thead><tbody>'+items.map(p=>'<tr><td>'+safe(p.code||'—')+'</td><td><strong>'+safe(p.name)+'</strong></td><td>'+p.stock+' un.</td><td>'+(p.units??'A confirmar')+'</td><td><span class="tag '+(p.units==null?'pending':'')+'">'+(p.units==null?'Quantidade pendente':'Cadastrado')+'</span></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum produto cadastrado nesta categoria.</div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=page==='inicio'?'Visão geral':page;let el=document.getElementById('app');
if(page==='inicio'){let units=products.reduce((a,p)=>a+(+p.stock||0),0);el.innerHTML='<div class="cards"><div class="card"><div class="label">Produtos cadastrados</div><div class="value">'+products.length+'</div></div><div class="card"><div class="label">Unidades em estoque</div><div class="value">'+units+'</div></div><div class="card"><div class="label">Saídas registradas</div><div class="value">'+moves.filter(m=>m.type==='Saída').reduce((a,m)=>a+m.qty,0)+'</div></div><div class="card"><div class="label">Vendedores</div><div class="value">'+sellers.length+'</div></div></div><div class="panel"><div class="panelhead"><h2>Estoque inicial de sorvetes</h2><span class="muted">14 produtos identificados</span></div>'+table(products.filter(p=>p.category==='Sorvetes'))+'</div><div class="note">Este é um painel web independente para visualização e testes. O estoque real do aplicativo Windows fica no banco SQLite do computador do posto e não aparece automaticamente aqui.</div>'}
else if(['Sorvetes','Lubrificantes','Outros'].includes(page)){el.innerHTML='<div class="panel"><div class="panelhead"><h2>'+page+'</h2><button class="btn green" id="add">+ Adicionar produto</button></div><div class="toolbar"><input id="q" placeholder="Buscar produto ou código"><button class="btn light" id="csv">Exportar CSV</button></div><div id="tbl">'+table(products.filter(p=>p.category===page))+'</div></div>';document.getElementById('q').oninput=e=>document.getElementById('tbl').innerHTML=table(products.filter(p=>p.category===page&&(p.name+' '+p.code).toLowerCase().includes(e.target.value.toLowerCase())));document.getElementById('add').onclick=()=>productForm();document.getElementById('csv').onclick=exportCsv}
else if(page==='Movimentações'){el.innerHTML='<div class="panel"><div class="panelhead"><h2>Registrar movimentação</h2></div><form id="move" class="form"><label>Tipo<select name="type"><option>Saída</option><option>Entrada</option><option>Perda</option></select></label><label>Produto<select name="product">'+products.map((p,i)=>'<option value="'+i+'">'+safe(p.name)+' (saldo '+p.stock+')</option>').join('')+'</select></label><label>Quantidade (unidades)<input name="qty" type="number" min="1" required></label><label>Vendedor<select name="seller"><option value="">Não se aplica</option>'+sellers.map(s=>'<option>'+safe(s)+'</option>').join('')+'</select></label><label class="wide">Observação<input name="note"></label><div class="wide"><button class="btn green">Registrar</button></div></form></div><div class="panel"><h2>Histórico</h2>'+ (moves.length?'<div class="tablewrap"><table><tr><th>DATA</th><th>TIPO</th><th>PRODUTO</th><th>QTD.</th><th>VENDEDOR</th></tr>'+moves.slice().reverse().map(m=>'<tr><td>'+safe(m.date)+'</td><td>'+m.type+'</td><td>'+safe(m.name)+'</td><td>'+m.qty+'</td><td>'+safe(m.seller||'—')+'</td></tr>').join('')+'</table></div>':'<div class="empty">Nenhuma movimentação neste navegador.</div>')+'</div>';document.getElementById('move').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),i=+f.get('product'),qty=+f.get('qty'),p=products[i],type=f.get('type');if(type!=='Entrada'&&qty>p.stock){alert('Estoque insuficiente. Disponível: '+p.stock);return}p.stock+=type==='Entrada'?qty:-qty;moves.push({date:new Date().toLocaleString('pt-BR'),type,name:p.name,qty,seller:f.get('seller'),note:f.get('note')});save();render()}}
else if(page==='Vendedores'){el.innerHTML='<div class="panel"><div class="panelhead"><h2>Vendedores</h2><button class="btn green" id="sellerAdd">+ Adicionar vendedor</button></div>'+sellers.map(s=>'<p>♙ &nbsp; <strong>'+safe(s)+'</strong></p>').join('')+'</div>';document.getElementById('sellerAdd').onclick=()=>{let n=prompt('Nome do vendedor:');if(n&&n.trim()){sellers.push(n.trim());save();render()}}}
else if(page==='Relatórios'){el.innerHTML='<div class="panel"><div class="panelhead"><h2>Relatórios e exportação</h2></div><p class="muted">Exporte as movimentações registradas neste navegador em CSV, compatível com Excel.</p><button class="btn" id="csv">Baixar relatório CSV</button></div><div class="note">A exportação deste painel inclui apenas os dados locais deste navegador. Para o banco SQLite do posto, use a opção de exportação dentro do aplicativo Windows.</div>';document.getElementById('csv').onclick=exportCsv}}
function productForm(){let n=prompt('Nome do produto:');if(!n)return;let c=prompt('Categoria: Sorvetes, Lubrificantes ou Outros','Outros');if(!['Sorvetes','Lubrificantes','Outros'].includes(c))return alert('Categoria inválida.');let code=prompt('Código (opcional):','')||'';products.push({name:n,category:c,code,units:null,stock:0,min:0});save();render()}
function exportCsv(){let rows=[['Código','Produto','Categoria','Estoque','Unidades por caixa'],...products.map(p=>[p.code,p.name,p.category,p.stock,p.units??'A confirmar'])];let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='estoque-grupo-atualize.csv';a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();
</script></body></html>
